name: Sync Upstream

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: localApps
          fetch-depth: 0

      - name: Merge upstream localApps
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/okxlin/appstore.git
          git fetch upstream localApps
          BASE="$(git merge-base HEAD upstream/localApps)"
          TIP="$(git rev-parse upstream/localApps)"
          if [ "${TIP}" = "${BASE}" ]; then
            echo "no_updates=true" >> "$GITHUB_ENV"
            echo "上游无更新。"
            exit 0
          fi
          PRE="$(git rev-parse HEAD)"
          # README.md 由本仓库自管理(.gitattributes: merge=ours),启用驱动
          # 让上游 README 变更在合并时保留本地版本,避免冲突
          git config merge.ours.driver true
          if ! git merge --no-edit upstream/localApps; then
            # 同步策略本就丢弃上游对 .github/workflows 的全部改动,因此该目录下的
            # 冲突(含"本地删除 vs 上游修改"的 renovate.yml 这类)可直接按合并前
            # 状态自动解决;只有其他路径冲突才需要人工处理。
            bad="$(git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/' || true)"
            if [ -n "${bad}" ]; then
              echo "::error::合并冲突(非工作流文件),请在本仓库执行 scripts/sync-upstream.sh 手动解决: ${bad}"
              exit 1
            fi
            echo "工作流文件冲突,按本地策略自动解决:"
            git diff --name-only --diff-filter=U
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              if git cat-file -e "${PRE}:${f}" 2>/dev/null; then
                git checkout "${PRE}" -- "${f}"
              else
                git rm -q "${f}"
              fi
            done <<< "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit -q
            echo "已按合并前状态解决。"
          fi
          echo "上游新增提交数: $(git rev-list --count "${BASE}..upstream/localApps")"
          # GITHUB_TOKEN 无法推送工作流文件变更(GitHub 硬限制,permissions 也不支持
          # workflows 作用域),因此丢弃上游对 .github/workflows 的全部改动:
          # 上游的 renovate 等工作流在本镜像仓库本就被禁用,无需跟进;本文件
          # (sync-upstream.yml)上游不存在,不受影响。变更仅由人工用 PAT 推送。
          changed="$(git diff --name-only "${PRE}" HEAD -- .github/workflows)"
          if [ -n "${changed}" ]; then
            echo "丢弃上游工作流变更:" && echo "${changed}"
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              if git cat-file -e "${PRE}:${f}" 2>/dev/null; then
                git checkout "${PRE}" -- "${f}"
              else
                git rm -q "${f}"
              fi
            done <<< "${changed}"
            git commit --amend --no-edit -q
            echo "已折叠进合并提交。"
          fi

      - name: Push
        if: env.no_updates != 'true'
        run: git push origin localApps

      # 上游的 renovate 定时工作流随镜像带入了本仓库,对镜像仓库无意义且可能产生
      # 失败通知,统一禁用(本工作流除外)。上游新增的定时工作流也会在每次同步后被禁用。
      - name: Disable foreign workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --paginate \
            | jq -r '.workflows[] | select(.name != "Sync Upstream" and .name != "Build Upstream Images") | .id' \
            | sort -u \
            | while read -r id; do
                [ -z "$id" ] && continue
                echo "禁用工作流 #$id"
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" || true
              done
          echo "done"
