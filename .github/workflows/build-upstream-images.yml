name: Build Upstream Images

# 为上游未发布 Docker 镜像的项目构建镜像,推送到本仓库所有者的 GHCR:
#   ghcr.io/skingko/moli   ← lexmount/moli 的 release 二进制打包(见 docker/moli/Dockerfile)
#   ghcr.io/skingko/aihot  ← KKKKhazix/AIHOT 的官方 Dockerfile 构建
# 手动触发,填哪个输入就构建哪个;两个都空则什么都不做。
on:
  workflow_dispatch:
    inputs:
      moli_version:
        description: 'moli 版本号(如 1.1.12,留空跳过 moli)'
        default: ''
      aihot_ref:
        description: 'AIHOT 的 ref(分支名或完整 SHA,留空跳过 aihot)'
        default: ''
      toonflow_ref:
        description: 'Toonflow 的 ref(分支名或完整 SHA,留空跳过 toonflow)'
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  moli:
    if: ${{ inputs.moli_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/moli
          platforms: linux/amd64,linux/arm64
          build-args: MOLI_VERSION=${{ inputs.moli_version }}
          tags: ghcr.io/${{ github.repository_owner }}/moli:${{ inputs.moli_version }}
          push: true
      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/user/packages/container/moli" \
            -f visibility=public 2>/dev/null \
            && echo "moli package set public" \
            || echo "::warning::无法自动设置公开,请到 https://github.com/skingko?tab=packages 手动设为 public"

  aihot:
    if: ${{ inputs.aihot_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AIHOT
        uses: actions/checkout@v4
        with:
          repository: KKKKhazix/AIHOT
          ref: ${{ inputs.aihot_ref }}
      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/aihot:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/aihot:latest
          push: true
      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/user/packages/container/aihot" \
            -f visibility=public 2>/dev/null \
            && echo "aihot package set public" \
            || echo "::warning::无法自动设置公开,请到 https://github.com/skingko?tab=packages 手动设为 public"

  toonflow:
    if: ${{ inputs.toonflow_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Toonflow
        uses: actions/checkout@v4
        with:
          repository: HBAI-Ltd/Toonflow-app
          ref: ${{ inputs.toonflow_ref }}
      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/toonflow:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/toonflow:latest
          push: true
      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/user/packages/container/toonflow" \
            -f visibility=public 2>/dev/null \
            && echo "toonflow package set public" \
            || echo "::warning::无法自动设置公开,请到 https://github.com/skingko?tab=packages 手动设为 public"
