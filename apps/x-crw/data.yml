    zh-Hant: 自架網頁擷取、爬取與搜尋 API,內建 MCP 伺服器供 AI Agent 呼叫。Rust 編寫的 Firecrawl/Tavily 替代品,記憶體約 6MB,內建 SearXNG 搜尋後端與 LightPanda JS 渲染器。
    ja: AI エージェント向け MCP サーバー同梱のセルフホスト Web スクレイピング・クロール・検索 API。Rust 製の Firecrawl/Tavily 代替、メモリ約 6MB、SearXNG と LightPanda 内蔵。
    ko: AI 에이전트용 MCP 서버를 포함한 셀프 호스팅 웹 스크래핑·크롤링·검색 API. Rust로 작성된 Firecrawl/Tavily 대안, 메모리 약 6MB, SearXNG 및 LightPanda 내장.
    ru: Self-hosted API веб-скрейпинга, краулинга и поиска с MCP-сервером для AI-агентов. Альтернатива Firecrawl/Tavily на Rust, ~6 МБ RAM, встроенные SearXNG и LightPanda.
    ms: API pengikisan, perayauan & carian web self-hosted dengan pelayan MCP untuk ejen AI. Alternatif Firecrawl/Tavily dalam Rust, ~6MB RAM, SearXNG & LightPanda terbina dalam.
    pt-br: API self-hosted de web scraping, crawling e busca com servidor MCP para agentes de IA. Alternativa a Firecrawl/Tavily em Rust, ~6MB RAM, SearXNG e LightPanda embutidos.
