networks:
  1panel-network:
    external: true

x-ap-env: &ap-env
  AP_ENVIRONMENT: prod
  AP_FRONTEND_URL: ${AP_FRONTEND_URL}
  # 两个密钥格式:加密键 32 位十六进制(openssl rand -hex 16),
  # JWT 64 位十六进制(openssl rand -hex 32);设置后保持不变,否则凭据/会话失效
  AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
  AP_JWT_SECRET: ${AP_JWT_SECRET}
  # 复用 1Panel 已安装的 PostgreSQL:安装面板自动创建随机库/用户/密码
  AP_POSTGRES_HOST: ${PANEL_DB_HOST}
  AP_POSTGRES_PORT: ${PANEL_DB_PORT}
  AP_POSTGRES_DATABASE: ${PANEL_DB_NAME}
  AP_POSTGRES_USERNAME: ${PANEL_DB_USER}
  AP_POSTGRES_PASSWORD: ${PANEL_DB_USER_PASSWORD}
  AP_REDIS_HOST: activepieces-redis
  AP_REDIS_PORT: "6379"
  AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD}
  AP_EXECUTION_MODE: UNSANDBOXED
  AP_TELEMETRY_ENABLED: ${AP_TELEMETRY_ENABLED}

services:
  # 入口脚本默认 WORKER_AND_APP 模式:单容器同时运行 API/UI 与流程执行器,
  # 并按 AP_JWT_SECRET 自动生成 worker token,无需拆分 worker 服务
  activepieces:
    image: activepieces/activepieces:0.92.3-hotfix.2
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment: *ap-env
    volumes:
      - activepieces-cache:/usr/src/app/cache
    depends_on:
      activepieces-redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:80/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      createdBy: "Apps"

  # 作业队列 sidecar:仅容器网络可达,随机密码;官方 pin 7.x,取当前 7.4 小版本
  activepieces-redis:
    image: redis:7.4-alpine
    restart: always
    networks:
      - 1panel-network
    command:
      - redis-server
      - --requirepass
      - ${AP_REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - activepieces-redis-data:/data
    labels:
      createdBy: "Apps"

volumes:
  activepieces-cache: {}
  activepieces-redis-data: {}
