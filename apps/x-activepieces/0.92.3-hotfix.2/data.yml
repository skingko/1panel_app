additionalProperties:
  formFields:
    - default: 13884
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: 端口
      label:
        en: 'Port'
        zh: '端口'
        zh-Hant: '埠'
        ja: 'ポート'
        ko: '포트'
        ru: 'Порт'
        ms: 'Port'
        pt-br: 'Porta'
      required: true
      rule: paramPort
      type: number

    - default: http://127.0.0.1:13884
      edit: true
      envKey: AP_FRONTEND_URL
      labelEn: 'Public URL (domain or IP:port, used for webhooks; keep consistent with reverse proxy)'
      labelZh: '公网访问地址(域名或 IP:端口,Webhook 回调依赖它,反代后请改成外部域名)'
      label:
        en: 'Public URL (domain or IP:port, used for webhooks; keep consistent with reverse proxy)'
        zh: '公网访问地址(域名或 IP:端口,Webhook 回调依赖它,反代后请改成外部域名)'
        zh-Hant: '公網存取位址(域名或 IP:埠,Webhook 依賴它,反向代理後請改為外部域名)'
        ja: '公開URL(ドメインまたは IP:ポート。Webhook で使用)'
        ko: '공개 URL(도메인 또는 IP:포트, Webhook에 사용)'
        ru: 'Публичный URL (домен или IP:порт; используется для webhook)'
        ms: 'URL awam (domain atau IP:port; digunakan untuk webhook)'
        pt-br: 'URL público (domínio ou IP:porta; usado para webhooks)'
      required: true
      type: text

    - default: '24476c7834913fa6887da569cb80267b'
      edit: true
      envKey: AP_ENCRYPTION_KEY
      labelEn: 'Credential encryption key (32 hex chars, preset; replace with openssl rand -hex 16, keep unchanged after setup)'
      labelZh: '凭据加密密钥(32 位十六进制,已预置,可换 openssl rand -hex 16,设置后勿改)'
      label:
        en: 'Credential encryption key (32 hex chars, preset; replace with openssl rand -hex 16, keep unchanged after setup)'
        zh: '凭据加密密钥(32 位十六进制,已预置,可换 openssl rand -hex 16,设置后勿改)'
        zh-Hant: '憑證加密金鑰(32 位十六進位,已預置,可更換,設定後勿改)'
        ja: '資格情報暗号化キー(32 桁の 16 進数、設定後は変更不可)'
        ko: '자격 증명 암호화 키(32자리 16진수, 설정 후 변경 금지)'
        ru: 'Ключ шифрования учётных данных (32 hex-символа, после настройки не менять)'
        ms: 'Kunci penyulitan kelayakan (32 aksara heks, jangan ubah selepas tetapan)'
        pt-br: 'Chave de criptografia de credenciais (32 caracteres hex, não altere após configurar)'
      required: true
      type: password

    - default: 'bd3db00e99d95c61b1d0899805507028ea1023e6cc1d314b8c2f4dbd0691ff66'
      edit: true
      envKey: AP_JWT_SECRET
      labelEn: 'JWT signing secret (64 hex chars, preset; replace with openssl rand -hex 32, keep unchanged after setup)'
      labelZh: '会话令牌签名密钥(64 位十六进制,已预置,可换 openssl rand -hex 32,设置后勿改)'
      label:
        en: 'JWT signing secret (64 hex chars, preset; replace with openssl rand -hex 32, keep unchanged after setup)'
        zh: '会话令牌签名密钥(64 位十六进制,已预置,可换 openssl rand -hex 32,设置后勿改)'
        zh-Hant: '會話權杖簽名金鑰(64 位十六進位,已預置,可更換,設定後勿改)'
        ja: 'JWT 署名シークレット(64 桁の 16 進数、設定後は変更不可)'
        ko: 'JWT 서명 시크릿(64자리 16진수, 설정 후 변경 금지)'
        ru: 'Секрет подписи JWT (64 hex-символа, после настройки не менять)'
        ms: 'Rahsia tandatangan JWT (64 aksara heks, jangan ubah selepas tetapan)'
        pt-br: 'Segredo de assinatura JWT (64 caracteres hex, não altere após configurar)'
      required: true
      type: password

    - edit: true
      envKey: AP_REDIS_PASSWORD
      labelEn: Redis password (auto-generated)
      labelZh: Redis 密码(安装时自动生成,设置后勿改)
      label:
        en: 'Redis password (auto-generated)'
        zh: 'Redis 密码(安装时自动生成,设置后勿改)'
        zh-Hant: 'Redis 密碼(安裝時自動生成,設定後勿改)'
        ja: 'Redis パスワード(インストール時に自動生成)'
        ko: 'Redis 비밀번호(설치 시 자동 생성)'
        ru: 'Пароль Redis (генерируется автоматически)'
        ms: 'Kata laluan Redis (jana automatik)'
        pt-br: 'Senha do Redis (gerada automaticamente)'
      random: true
      required: true
      type: password

    - default: postgresql
      envKey: PANEL_DB_TYPE
      labelEn: Database Runtime
      labelZh: 数据库 Runtime
      label:
        en: 'Database Runtime'
        zh: '数据库 Runtime'
        zh-Hant: '資料庫 Runtime'
        ja: 'データベース Runtime'
        ko: '데이터베이스 Runtime'
        ru: 'Среда базы данных'
        ms: 'Runtime Pangkalan Data'
        pt-br: 'Runtime de banco de dados'
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql
      child:
        default: ''
        envKey: PANEL_DB_HOST
        labelEn: PostgreSQL Service
        labelZh: PostgreSQL 服务
        label:
          en: 'PostgreSQL Service'
          zh: 'PostgreSQL 服务'
          zh-Hant: 'PostgreSQL 服務'
          ja: 'PostgreSQL サービス'
          ko: 'PostgreSQL 서비스'
          ru: 'Сервис PostgreSQL'
          ms: 'Perkhidmatan PostgreSQL'
          pt-br: 'Serviço PostgreSQL'
        required: true
        type: service

    - default: 5432
      edit: true
      envKey: PANEL_DB_PORT
      labelEn: Database Port
      labelZh: 数据库端口
      label:
        en: 'Database Port'
        zh: '数据库端口'
        zh-Hant: '資料庫連接埠'
        ja: 'データベースポート'
        ko: '데이터베이스 포트'
        ru: 'Порт базы данных'
        ms: 'Port Pangkalan Data'
        pt-br: 'Porta do banco de dados'
      required: true
      rule: paramPort
      type: number

    - default: activepieces
      edit: true
      envKey: PANEL_DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      label:
        en: 'Database Name'
        zh: '数据库名'
        zh-Hant: '資料庫名稱'
        ja: 'データベース名'
        ko: '데이터베이스 이름'
        ru: 'Имя базы данных'
        ms: 'Nama Pangkalan Data'
        pt-br: 'Nome do banco de dados'
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: activepieces
      edit: true
      envKey: PANEL_DB_USER
      labelEn: Database User
      labelZh: 数据库用户
      label:
        en: 'Database User'
        zh: '数据库用户'
        zh-Hant: '資料庫使用者'
        ja: 'データベースユーザー'
        ko: '데이터베이스 사용자'
        ru: 'Пользователь базы данных'
        ms: 'Pengguna Pangkalan Data'
        pt-br: 'Usuário do banco de dados'
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: ''
      edit: true
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database Password
      labelZh: 数据库密码
      label:
        en: 'Database Password'
        zh: '数据库密码'
        zh-Hant: '資料庫密碼'
        ja: 'データベースパスワード'
        ko: '데이터베이스 비밀번호'
        ru: 'Пароль базы данных'
        ms: 'Kata Laluan Pangkalan Data'
        pt-br: 'Senha do banco de dados'
      required: true
      rule: paramComplexity
      type: password

    - default: 'false'
      edit: true
      envKey: AP_TELEMETRY_ENABLED
      labelEn: Telemetry
      labelZh: 遥测上报
      label:
        en: 'Telemetry'
        zh: '遥测上报'
        zh-Hant: '遙測上報'
        ja: 'テレメトリ'
        ko: '텔레메트리'
        ru: 'Телеметрия'
        ms: 'Telemetri'
        pt-br: 'Telemetria'
      required: true
      type: select
      values:
        - label: 关闭
          value: 'false'
        - label: 开启
          value: 'true'
